server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/veterinary_hospital?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=Vet@1234

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.jackson.serialization.write-dates-as-timestamps=false
spring.mvc.hiddenmethod.filter.enabled=true


# Public URL used inside pet-report QR codes. Change this in production.
app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:8080}
app.qr.token-expiry-days=${APP_QR_TOKEN_EXPIRY_DAYS:365}


# Dynamic UPI QR payment configuration. Configure a real merchant UPI ID before accepting payments.
payment.upi-id=${PAYMENT_UPI_ID:}
payment.payee-name=${PAYMENT_PAYEE_NAME:PawsCare Veterinary Hospital}
