<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Receptionist Statistics | PawsCare</title><link rel="stylesheet" href="/css/role-premium.css"></head><body><div class="role-shell"><aside class="role-sidebar"><div class="role-brand">PawsCare</div><div class="role-sub">RECEPTIONIST WORKSPACE</div><nav class="role-nav"><a href="/reception.html">Dashboard</a><a href="/reception-1.html">Register Pet & Owner</a><a href="/reception-2.html">Veterinarian Availability</a><a href="/reception-3.html">Pet Management</a><a href="/reception-4.html">Owner Management</a><a href="/reception-5.html">Appointments</a><a href="/reception-6.html">Grooming Appointments</a><a href="/reception-7.html">Operations</a><a href="/reception-8.html">Records</a><a class="active" href="/reception-statistics.html">Statistics</a></nav><button class="role-logout" onclick="localStorage.clear();location='/login.html'">Sign out</button></aside><main class="role-main"><header class="role-top"><div><h1>Receptionist Statistics</h1><p>Live statistics calculated from the existing database.</p></div></header><section id="stats" class="summary-grid"></section></main></div><script>function esc(v){return String(v??'-').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}async function load(){if(localStorage.getItem('role')!=='RECEPTIONIST'){location='/login.html';return}try{const r=await fetch('/api/reception/stats');const s=await r.json();if(!r.ok)throw new Error(s.message||'Request failed');const a=[['Pet Owners / Customers',s.petOwners],['Pets / Patients',s.pets],['Appointments',s.appointments],['Completed Appointments',s.completedAppointments],['Pending Appointments',s.pendingAppointments],['Veterinarians',s.veterinarians],['Grooming Bookings',s.groomingBookings],['Medical Reports',s.medicalReports]];document.getElementById('stats').innerHTML=a.map(x=>`<div class="summary-card"><h3>${esc(x[0])}</h3><strong>${x[1]??0}</strong></div>`).join('')}catch(e){document.getElementById('stats').innerHTML=`<section class="content-card"><p>${esc(e.message)}</p></section>`}}load()</script></body></html>
