<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Veterinarian Statistics | PawsCare</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"><link rel="stylesheet" href="/css/theme.css"></head><body><div class="role-shell"><aside class="role-sidebar"><div class="role-brand">PawsCare</div><div class="role-sub">VETERINARIAN WORKSPACE</div><nav class="role-nav"><a href="/vet.html">Dashboard</a><a href="/vet-1.html">Appointments</a><a href="/vet-2.html">Patients</a><a href="/vet-3.html">Medical Records</a><a href="/vet-4.html">Prescriptions</a><a href="/vet-5.html">Vaccinations</a><a href="/vet-6.html">Availability</a><a href="/vet-7.html">Profile</a><a class="active" href="/vet-statistics.html">Statistics</a></nav><button class="role-logout" onclick="logout()">Sign out</button></aside><main class="role-main"><header class="role-top"><div><h1>Veterinarian Statistics</h1><p>Statistics for the currently logged-in veterinarian.</p></div></header><div id="stats" class="summary-grid"></div></main></div><script>async function api(u){const r=await fetch(u);const d=await r.json();if(!r.ok)throw new Error(d.message||'Request failed');return d}function logout(){localStorage.clear();location='/login.html'}function esc(v){return String(v??'-').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}async function load(){try{const u=localStorage.getItem('username');if(localStorage.getItem('role')!=='VETERINARIAN'||!u){location='/login.html';return}const s=await api('/api/vet/stats/'+encodeURIComponent(u));const a=[['Patients',s.patients],['Appointments',s.appointments],['Completed Appointments',s.completedAppointments],['Pending Appointments',s.pendingAppointments],['Prescriptions',s.prescriptions],['Medical Reports',s.medicalReports],['Vaccinations',s.vaccinations]];document.getElementById('stats').innerHTML=a.map(x=>`<div class="summary-card"><h3>${esc(x[0])}</h3><strong>${x[1]??0}</strong></div>`).join('')}catch(e){document.getElementById('stats').innerHTML='<section class="card"><p>'+esc(e.message)+'</p></section>'}}load()</script><script src="/js/shell.js" defer></script></body></html>
